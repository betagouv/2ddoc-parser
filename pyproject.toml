[project]
name = "2ddoc_parser"
version = "1.0.5"
description = "Api pour décodé et vérifier les 2D docs de l'ANTS"
authors = [
    { name = "Nicolas Sagon", email = "nicolas.sagon@beta.gouv.fr" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "cryptography>=43.0.0",
    "typing-extensions>=4.12.2",
    "pydantic>=2.12.4",
]

[dependency-groups]
dev = [
    "ruff>=0.12.11",
    "pytest>=8.4.1",
    "pre-commit>=3.6.0",
    "pyright>=1.1.408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_2ddoc_parser"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
