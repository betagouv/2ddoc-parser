[project]
name = "2ddoc_parser"
version = "1.0.7"
description = "Api pour décoder et vérifier les 2D docs de l'ANTS"
authors = [
    { name = "Nicolas Sagon", email = "nicolas.sagon@beta.gouv.fr" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "pytest>=9.2.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_2ddoc_parser"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF100"]
ignore = ["E501", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
