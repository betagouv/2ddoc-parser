# Installe les hooks aux étapes pre-commit et pre-push :
# - pre-commit : gitleaks scanne les modifications stagées (diff de l'index) ;
# - pre-push : scripts/gitleaks_pre_push.sh scanne les commits sortants
#   (au push, l'index est vide, un scan --staged ne détecterait rien).
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
        stages: [pre-commit]

  # Scan gitleaks des commits sortants au push : l'index est vide à ce stade,
  # le hook pre-commit (--staged) ne détecterait rien.
  - repo: local
    hooks:
      - id: gitleaks-pre-push
        name: gitleaks pre-push (commits sortants)
        language: system
        entry: bash scripts/gitleaks_pre_push.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        language: system
        pass_filenames: false
        files: (^|/)pyproject\.toml$
        entry: uv lock
