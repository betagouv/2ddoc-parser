version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Pas de groupe pour les majeures : un groupe wildcard en `major` les
      # regrouperait toutes dans une seule PR au lieu de les garder reviewables
      # individuellement. Elles tombent donc en PR séparées.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
